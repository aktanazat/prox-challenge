<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniPro 220 Technical Expert — Vulcan</title>
<meta name="description" content="Multimodal technical expert for the Vulcan OmniPro 220 welder. Setup, settings, weld diagnosis and maintenance, grounded in the machine's own manuals.">
<meta name="theme-color" content="#F6F3EC">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff6a00'/%3E%3Cpath d='M7 7h6l3 12 3-12h6l-7 20h-4z' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
</head>
<body>

<header class="topbar">
  <h1 class="brand">
    <span class="brand-name">Vulcan OmniPro 220</span>
    <span class="brand-role">Technical Expert</span>
  </h1>
  <div class="topbar-actions">
    <span class="garage-mic mono" id="garage-mic" hidden role="status" aria-label="Garage mode microphone">
      <span class="gm-dot" aria-hidden="true"></span>MIC
    </span>
    <button id="new-chat" class="text-btn" title="Start a fresh session">New</button>
    <button id="garage-toggle" class="text-btn" aria-pressed="false" hidden
            title="Hands-free: continuous voice input, spoken replies">Garage mode</button>
    <div class="link-status" role="status" aria-live="polite" title="Connection status">
      <span class="dot" id="status-dot" data-state="connecting"></span>
      <span class="status-text sr-only" id="status-text">LINKING</span>
    </div>
  </div>
</header>

<main class="layout">

  <section class="chat" aria-label="Conversation">
    <div class="messages" id="messages"></div>
    <div class="composer">
      <div class="suggestions" id="suggestions" role="group" aria-label="Suggested questions"></div>
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="Ask anything..."
                  aria-label="Message the technical expert" autocomplete="off"></textarea>
        <div class="composer-row">
          <div class="composer-left">
            <button id="upload-btn" class="icon-btn" aria-label="Upload a photo of your weld" title="Upload weld photo">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            </button>
            <button id="mic-btn" class="icon-btn" aria-label="Dictate message" aria-pressed="false" title="Dictate">
              <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7.25" y="2.5" width="5.5" height="9" rx="2.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5M7 17.5h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <button id="tts-btn" class="icon-btn" aria-label="Read replies aloud" aria-pressed="false" title="Read replies aloud">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5v5h3l4 3.5v-12L6 7.5H3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M13 7a4.2 4.2 0 0 1 0 6M15.5 5a7.5 7.5 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
          <button id="send-btn" class="send-btn" aria-label="Send message" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4.5M5 9.5L10 4.5l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <input type="file" id="file-input" accept="image/*" hidden>
      <p class="composer-note">AI assistance — verify safety-critical steps against the owner's
      manual before welding.</p>
    </div>
  </section>

  <section class="workbench" aria-label="Workbench">
    <div class="panel machine-panel">
      <div class="panel-head">
        <h2 class="panel-title sr-only">Machine</h2>
        <span class="head-rule" aria-hidden="true"></span>
        <span class="practice-chip mono" id="practice-chip" hidden>PRACTICE</span>
        <div class="panel-tools">
          <button id="practice-toggle" class="text-btn" aria-pressed="false"
                  title="Quiz mode — the expert asks, you click the part">PRACTICE</button>
          <button id="machine-reset" class="text-btn" title="Resume idle orbit">RESET VIEW</button>
          <button id="machine-toggle" class="text-btn" aria-expanded="true" aria-controls="machine-body">COLLAPSE</button>
        </div>
      </div>
      <div class="machine-body" id="machine-body">
        <div class="machine-canvas" id="machine-canvas" role="img"
             aria-label="Interactive 3D model of the Vulcan OmniPro 220 welder. Drag to orbit."><span
             class="plate-label" aria-hidden="true">Machine</span></div>
      </div>
      <div class="tutorial-player" id="tutorial-player" role="group" aria-label="Guided tutorial player" hidden>
        <div class="tp-head">
          <span class="tp-title" id="tp-title"></span>
          <span class="tp-step mono" id="tp-step" aria-live="polite"></span>
        </div>
        <p class="tp-caption" id="tp-caption" aria-live="polite"></p>
        <p class="tp-note" id="tp-note" role="status" hidden></p>
        <div class="tp-controls">
          <button id="tp-prev" class="icon-btn tp-btn" aria-label="Previous step" title="Previous step">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4v12M15.5 4.5L8 10l7.5 5.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
          </button>
          <button id="tp-play" class="icon-btn tp-btn" aria-label="Pause tutorial" aria-pressed="false" title="Play / pause">
            <svg class="tp-ico-play" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4.5l9.5 5.5L6 15.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            <svg class="tp-ico-pause" viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 4.5v11M13.5 4.5v11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button id="tp-next" class="icon-btn tp-btn" aria-label="Next step" title="Next step">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15 4v12M4.5 4.5L12 10l-7.5 5.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
          </button>
          <button id="tp-replay" class="icon-btn tp-btn" aria-label="Replay step" title="Replay step">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10a6 6 0 1 1 1.8 4.3M4 10V5.5M4 10h4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="tp-speed" class="text-btn mono" aria-label="Playback speed" title="Playback speed">1×</button>
          <button id="tp-end" class="tp-chip" hidden>↻ Replay tutorial</button>
        </div>
      </div>
    </div>

    <div class="panel artifacts-panel">
      <div class="panel-head">
        <h2 class="panel-title">Artifacts</h2>
        <span class="head-rule" aria-hidden="true"></span>
        <span class="panel-count mono" id="artifact-count" hidden></span>
      </div>
      <div class="artifact-stack" id="artifact-stack">
        <p class="stack-empty" id="stack-empty">Charts, diagrams and machine views produced by the
        expert appear here.</p>
      </div>
    </div>
  </section>

</main>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightbox-close" aria-label="Close image">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <img id="lightbox-img" alt="">
</div>

<script type="module" src="/web/machine.js"></script>
<script type="module" src="/web/app.js"></script>
</body>
</html>
